<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clase Git - SENATI</title>
    <style>
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .container {
        background-color: var(--card-bg);
        padding: 2.5rem;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.05);
        text-align: center;
      }

      h1 {
        font-size: 2.2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        color: var(--text-muted);
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }

      h2 {
        font-size: 1.2rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        margin-bottom: 1.5rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      li {
        background: rgba(255, 255, 255, 0.03);
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.3s ease;
      }

      li:hover {
        transform: translateY(-3px);
        background: rgba(56, 189, 248, 0.1);
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hecho por Adrian Leonardo</h1>
      <h1>Mi primera página con GIT</h1>
      <p>Estamos aprendiendo control de versiones en SENATI</p>

      <h2>Tecnologías que aprenderemos</h2>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
      </ul>
    </div>
  </body>
</html>
